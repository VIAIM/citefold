name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

  build:
    name: Build and install distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Verify distribution contents
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")
          sdist = glob.glob("dist/*.tar.gz")
          assert len(wheel) == 1, wheel
          assert len(sdist) == 1, sdist

          with zipfile.ZipFile(wheel[0]) as archive:
              wheel_names = archive.namelist()
          forbidden = ("tests/", "benchmarks/", "docs/", "examples/")
          leaked = [name for name in wheel_names if name.startswith(forbidden)]
          assert not leaked, f"non-runtime files leaked into wheel: {leaked}"
          assert "citefold/py.typed" in wheel_names

          with tarfile.open(sdist[0], "r:gz") as archive:
              names = archive.getnames()
          root = names[0].split("/", 1)[0]
          required = {
              f"{root}/README.md",
              f"{root}/README.zh-CN.md",
              f"{root}/LICENSE",
              f"{root}/assets/citefold-wordmark.svg",
              f"{root}/tests/test_agent_turn.py",
              f"{root}/tests/test_citefold.py",
              f"{root}/tests/test_officelife_track_b_benchmark.py",
              f"{root}/tests/test_officelife_track_b_contract.py",
              f"{root}/tests/fixtures/v0_1_store/FIXTURE.json",
              f"{root}/tests/fixtures/v0_1_store/store/tenants/tenant-a/users/user-1/namespaces/personal/indexes/memory.sqlite3",
              f"{root}/benchmarks/fixtures/multimodal_memory_bench_v1.json",
              f"{root}/benchmarks/OFFICELIFE_TRACK_B_ARTIFACT_CONTRACT_V1.md",
              f"{root}/benchmarks/OFFICELIFE_TRACK_B_EXECUTION_PROFILE_V1.md",
              f"{root}/benchmarks/officelife_track_b_benchmark.py",
              f"{root}/benchmarks/officelife_track_b_contract.py",
              f"{root}/benchmarks/schemas/officelife_track_b/v1/common.schema.json",
              f"{root}/benchmarks/schemas/officelife_track_b/v1/dataset-manifest.schema.json",
              f"{root}/benchmarks/schemas/officelife_track_b/v1/event.schema.json",
              f"{root}/benchmarks/schemas/officelife_track_b/v1/sealed-run-manifest.schema.json",
              f"{root}/benchmarks/schemas/officelife_track_b/v1/task-input.schema.json",
              f"{root}/benchmarks/schemas/officelife_track_b/v1/task-label.schema.json",
              f"{root}/benchmarks/schemas/officelife_track_b/v1/user.schema.json",
              f"{root}/docs/architecture.md",
              f"{root}/examples/quickstart.py",
          }
          missing = sorted(required - set(names))
          assert not missing, f"source distribution is missing: {missing}"
          PY

      - name: Smoke-test installed wheel
        run: |
          python -m venv "${RUNNER_TEMP}/citefold-smoke"
          "${RUNNER_TEMP}/citefold-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "${RUNNER_TEMP}/citefold-smoke/bin/python" -m pip check
          "${RUNNER_TEMP}/citefold-smoke/bin/citefold" --version
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/citefold-smoke/bin/python" -I - <<'PY'
          import json
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import citefold
          from citefold import AGENT_TURN_CONTRACT, AgentTurnContext, Citefold, MemoryScope

          assert Path(citefold.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())

          with TemporaryDirectory() as root:
              memory = Citefold(Path(root))
              prior = MemoryScope("smoke", "user", "work", "ci", "session-prior")
              current = MemoryScope("smoke", "user", "work", "ci", "session-current")
              memory.ingest_text(
                  prior,
                  "The launch codename is ORCHID-77.",
                  source="ci_smoke",
              )
              turn = memory.prepare_agent_turn(
                  current,
                  "What is the launch codename?",
                  turn_id="ci-turn-1",
              )
              assert isinstance(turn, AgentTurnContext)
              assert turn.contract_version == AGENT_TURN_CONTRACT
              assert turn.memory_pack.coverage == "supported"
              assert turn.memory_pack.citations
              assert "ORCHID-77" in turn.memory_pack.markdown
              json.dumps(turn.as_dict(), ensure_ascii=False, allow_nan=False)

              completed = memory.complete_agent_turn(
                  turn,
                  "The launch codename is ORCHID-77.",
                  source="ci_agent",
              )
              assert len(completed.observation_ids) == 2
              assert len(completed.episode_ids) == 1

              isolated = MemoryScope("other", "user", "work", "ci", "session-current")
              empty = memory.prepare_agent_turn(
                  isolated,
                  "What is the launch codename?",
                  turn_id="ci-turn-isolated",
              )
              assert empty.memory_pack.coverage == "none"
              assert "ORCHID-77" not in empty.memory_pack.markdown
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: citefold-distributions
          path: dist/
          if-no-files-found: error
