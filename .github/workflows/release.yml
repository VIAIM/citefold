name: Release to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out released revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          import citefold

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if citefold.__version__ != version:
              raise SystemExit(
                  "citefold.__version__ "
                  f"{citefold.__version__!r} does not match pyproject {version!r}"
              )
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match {expected!r}")
          PY

      - name: Run tests from the released revision
        run: python -m pytest

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Verify Track B source artifacts
        run: |
          python - <<'PY'
          import glob
          import tarfile

          sdist = glob.glob("dist/*.tar.gz")
          assert len(sdist) == 1, sdist
          with tarfile.open(sdist[0], "r:gz") as archive:
              names = archive.getnames()
          root = names[0].split("/", 1)[0]
          required = {
              f"{root}/benchmarks/OFFICELIFE_TRACK_B_ARTIFACT_CONTRACT_V1.md",
              f"{root}/benchmarks/OFFICELIFE_TRACK_B_EXECUTOR_V1.md",
              f"{root}/benchmarks/OFFICELIFE_TRACK_B_EXECUTION_PROFILE_V1.md",
              f"{root}/benchmarks/OFFICELIFE_TRACK_B_QUALIFICATION_V1.md",
              f"{root}/benchmarks/officelife_track_b_benchmark.py",
              f"{root}/benchmarks/officelife_track_b_contract.py",
              f"{root}/benchmarks/officelife_track_b_executor.py",
              f"{root}/benchmarks/officelife_track_b_latency.py",
              f"{root}/benchmarks/officelife_track_b_qualification.py",
              f"{root}/benchmarks/schemas/officelife_track_b_executor/v1/execution.schema.json",
              f"{root}/benchmarks/schemas/officelife_track_b_qualification/v1/qualification.schema.json",
              f"{root}/benchmarks/schemas/officelife_track_b/v1/common.schema.json",
              f"{root}/benchmarks/schemas/officelife_track_b/v1/dataset-manifest.schema.json",
              f"{root}/benchmarks/schemas/officelife_track_b/v1/event.schema.json",
              f"{root}/benchmarks/schemas/officelife_track_b/v1/sealed-run-manifest.schema.json",
              f"{root}/benchmarks/schemas/officelife_track_b/v1/task-input.schema.json",
              f"{root}/benchmarks/schemas/officelife_track_b/v1/task-label.schema.json",
              f"{root}/benchmarks/schemas/officelife_track_b/v1/user.schema.json",
              f"{root}/tests/test_officelife_track_b_benchmark.py",
              f"{root}/tests/test_officelife_track_b_contract.py",
              f"{root}/tests/test_officelife_track_b_executor.py",
              f"{root}/tests/test_officelife_track_b_latency.py",
              f"{root}/tests/test_officelife_track_b_qualification.py",
              f"{root}/tests/test_officelife_track_b_qualification_bundles.py",
          }
          missing = sorted(required - set(names))
          assert not missing, f"source distribution is missing: {missing}"
          PY

      - name: Smoke-test exact release wheel
        run: |
          python -m venv "${RUNNER_TEMP}/citefold-release-smoke"
          "${RUNNER_TEMP}/citefold-release-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "${RUNNER_TEMP}/citefold-release-smoke/bin/python" -m pip check
          "${RUNNER_TEMP}/citefold-release-smoke/bin/citefold" --version
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/citefold-release-smoke/bin/python" -I - <<'PY'
          import json
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import citefold
          from citefold import AGENT_TURN_CONTRACT, AgentTurnContext, Citefold, MemoryScope

          assert Path(citefold.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())

          with TemporaryDirectory() as root:
              memory = Citefold(Path(root))
              prior = MemoryScope("smoke", "user", "work", "release", "session-prior")
              current = MemoryScope("smoke", "user", "work", "release", "session-current")
              memory.ingest_text(
                  prior,
                  "The launch codename is ORCHID-77.",
                  source="release_smoke",
              )
              turn = memory.prepare_agent_turn(
                  current,
                  "What is the launch codename?",
                  turn_id="release-turn-1",
              )
              assert isinstance(turn, AgentTurnContext)
              assert turn.contract_version == AGENT_TURN_CONTRACT
              assert turn.memory_pack.coverage == "supported"
              assert turn.memory_pack.citations
              assert "ORCHID-77" in turn.memory_pack.markdown
              json.dumps(turn.as_dict(), ensure_ascii=False, allow_nan=False)

              completed = memory.complete_agent_turn(
                  turn,
                  "The launch codename is ORCHID-77.",
                  source="release_agent",
              )
              assert len(completed.observation_ids) == 2
              assert len(completed.episode_ids) == 1

              isolated = MemoryScope("other", "user", "work", "release", "session-current")
              empty = memory.prepare_agent_turn(
                  isolated,
                  "What is the launch codename?",
                  turn_id="release-turn-isolated",
              )
              assert empty.memory_pack.coverage == "none"
              assert "ORCHID-77" not in empty.memory_pack.markdown
          PY

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum * > ../SHA256SUMS

      - name: Upload release distributions
        uses: actions/upload-artifact@v7
        with:
          name: citefold-distributions
          path: dist/
          if-no-files-found: error

      - name: Upload release checksums
        uses: actions/upload-artifact@v7
        with:
          name: citefold-checksums
          path: SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/citefold
    permissions:
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8
        with:
          name: citefold-distributions
          path: dist/

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          print-hash: true

  release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8
        with:
          name: citefold-distributions
          path: dist/

      - name: Download release checksums
        uses: actions/download-artifact@v8
        with:
          name: citefold-checksums
          path: .

      - name: Create release after PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* SHA256SUMS --verify-tag --generate-notes
