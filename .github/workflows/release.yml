name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out released revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          import citefold

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if citefold.__version__ != version:
              raise SystemExit(
                  "citefold.__version__ "
                  f"{citefold.__version__!r} does not match pyproject {version!r}"
              )
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match {expected!r}")
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Upload release distributions
        uses: actions/upload-artifact@v7
        with:
          name: citefold-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/citefold
    permissions:
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v8
        with:
          name: citefold-distributions
          path: dist/

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@v1.14.0
        with:
          print-hash: true
