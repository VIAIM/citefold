name: Bug report
description: Report reproducible incorrect behavior in Citefold.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove private memory, credentials, and personal media from all examples.

  - type: input
    id: version
    attributes:
      label: Citefold version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows (unsupported)
        - Other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe code or command sequence that reproduces the problem.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Redact credentials, personal data, filesystem paths, and source media.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private memory, and personal media from this report.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
