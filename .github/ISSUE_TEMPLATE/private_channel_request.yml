name: Private channel request
description: Ask maintainers to establish a private channel without publishing sensitive details.
title: "[Private channel request]"
body:
  - type: markdown
    attributes:
      value: |
        Private reporting is not enabled for this repository yet. This issue is public. Do not add vulnerability details, credentials, personal data, incident details, identities, or private memory. Maintainers will use this request only to arrange a private channel.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Public-content confirmation
      options:
        - label: I have not included any sensitive details in this public request.
          required: true
